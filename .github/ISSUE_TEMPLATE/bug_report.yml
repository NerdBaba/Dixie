name: Bug report
description: Report a reproducible problem in Dixie
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove private file names, URLs, IP addresses, and other personal data from logs before posting.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.6"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: DLNA device or client
      placeholder: "e.g. TV model / app and software version"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Dixie
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability. I will use the private security reporting path for vulnerabilities.
          required: true
