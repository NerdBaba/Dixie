name: Feature request
description: Suggest an improvement for Dixie
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Relevant DLNA device or client
      placeholder: "Optional"
  - type: textarea
    id: notes
    attributes:
      label: Additional context
